services:
  user-service:
    build:
      context: .
      dockerfile: UserService/Dockerfile
    ports:
      - "7002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=158.160.191.82;Port=5432;Database=user_service;Username=user_service;Password=user_service_password;SSL Mode=Disable
    restart: unless-stopped

  cooling-service:
    build:
      context: .
      dockerfile: CoolingService/Dockerfile
    ports:
      - "7001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=158.160.191.82;Port=5432;Database=user_service;Username=user_service;Password=user_service_password;SSL Mode=Disable
    restart: unless-stopped

  portfolio-service:
    build:
      context: .
      dockerfile: PortfolioService/Dockerfile
    ports:
      - "7003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=158.160.191.82;Port=5432;Database=user_service;Username=user_service;Password=user_service_password;SSL Mode=Disable
      - Services__UserService=http://user-service:8080
      - Services__CoolingService=http://cooling-service:8080
    depends_on:
      - user-service
      - cooling-service
    restart: unless-stopped

